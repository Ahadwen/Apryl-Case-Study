<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apryl Case Study</title>
  <link rel="stylesheet" href="vendor/reveal/reset.css">
  <link rel="stylesheet" href="vendor/reveal/reveal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <!-- Slide content lives in slides.md. "---" separates slides, "--" separates vertical sub-slides. -->
      <section data-markdown="slides.md"
               data-separator="^\r?\n---\r?\n$"
               data-separator-vertical="^\r?\n--\r?\n$"
               data-separator-notes="^Note:"></section>
    </div>
  </div>

  <script src="vendor/reveal/reveal.js"></script>
  <script src="vendor/reveal/markdown.js"></script>
  <script src="vendor/reveal/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      width: 1280,
      height: 720,
      margin: 0.06,
      transition: 'fade',
      plugins: [RevealMarkdown, RevealNotes]
    });
  </script>
</body>
</html>
